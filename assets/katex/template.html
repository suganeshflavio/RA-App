<!doctype html>
<html>
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no" />
<link rel="stylesheet" href="katex.min.css" />
<style>
  html, body {
    margin: 0;
    padding: 0;
    background: transparent;
    overflow-x: hidden;
    overflow-y: hidden;
    box-sizing: border-box;
  }
  body {
    font-family: -apple-system, BlinkMacSystemFont, Roboto, sans-serif;
    font-size: 15px;
    line-height: 1.85;
    color: #3A1E0B;
    word-wrap: break-word;
    overflow-wrap: break-word;
    padding: 2px 0 8px 0;
    box-sizing: border-box;
  }
  #content {
    padding-bottom: 6px;
    box-sizing: border-box;
  }
  #content > *:first-child { margin-top: 0; }
  #content > *:last-child { margin-bottom: 4px; }
  img { max-width: 100%; height: auto; border-radius: 8px; display: block; margin: 6px 0; }
  p { margin: 0 0 6px; line-height: 1.85; }
  .katex {
    font-size: 1.08em;
    line-height: 1.35;
    white-space: normal;
  }
  .katex-html {
    overflow: visible;
  }
  .katex-display {
    margin: 6px 0;
    padding: 4px 0 8px 0;
  }
</style>
</head>
<body>
  <div id="content"></div>
  <script>
    // Measures the content itself, not the page: the page's scroll/offset
    // height is never smaller than the WebView, so measuring it made every
    // re-measure add Flutter's safety margin again and the box kept growing.
    function postHeight() {
      if (window.FlutterHeight) {
        var content = document.getElementById('content');
        if (!content) return;
        var bottomPadding = parseFloat(getComputedStyle(document.body).paddingBottom) || 0;
        var h = Math.ceil(content.getBoundingClientRect().bottom + bottomPadding);
        window.FlutterHeight.postMessage(String(h));
      }
    }
    window.addEventListener('load', function() {
      postHeight();
      setTimeout(postHeight, 50);
      setTimeout(postHeight, 200);
    });
    // re-measure when images load or fonts settle
    if (window.ResizeObserver) {
      new ResizeObserver(function() { postHeight(); }).observe(document.getElementById('content'));
    }
    document.addEventListener('load', function(event) {
      if (event.target && event.target.tagName === 'IMG') postHeight();
    }, true);
    postHeight();
  </script>
</body>
</html>
